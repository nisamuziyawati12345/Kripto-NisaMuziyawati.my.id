<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kriptografi Klasik</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-shield-lock-fill"></i>
            Kriptografi Klasik
        </a>

        <div class="d-flex gap-2 align-items-center">

            <a href="/" class="btn btn-outline-light btn-sm">Home</a>
            <a href="/about" class="btn btn-outline-light btn-sm">About</a>

            <!-- THEME TOGGLE -->
            <button id="themeToggle" class="btn btn-warning btn-sm">
                <i class="bi bi-moon-fill"></i>
            </button>

        </div>

    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

<!-- FOOTER -->
<footer class="text-center py-3 mt-5 text-muted">
    © 2026 Kriptografi Flask Project
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- DARK MODE SCRIPT (FIXED + PERSISTENT) -->
<script>
const toggleBtn = document.getElementById("themeToggle");
const html = document.documentElement;

// load theme dari localStorage
const savedTheme = localStorage.getItem("theme");
if (savedTheme) {
    html.setAttribute("data-bs-theme", savedTheme);
    updateIcon(savedTheme);
}

toggleBtn.addEventListener("click", () => {

    let currentTheme = html.getAttribute("data-bs-theme");

    let newTheme = (currentTheme === "dark") ? "light" : "dark";

    html.setAttribute("data-bs-theme", newTheme);
    localStorage.setItem("theme", newTheme);

    updateIcon(newTheme);
});

function updateIcon(theme) {
    if (theme === "light") {
        toggleBtn.innerHTML = '<i class="bi bi-sun-fill"></i>';
    } else {
        toggleBtn.innerHTML = '<i class="bi bi-moon-fill"></i>';
    }
}
</script>

</body>
</html>
